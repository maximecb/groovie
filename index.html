<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groovie</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js"></script>
</head>
<body>

    <h1>Groovie</h1>

    <div class="group">
        <div class="label">Controls</div>
        <div class="controls">
            <!-- TODO: do we want an obvious play button at the top? -->
            <label>Tempo: <span id="tempo_val">120</span> BPM</label>
            <input type="range" id="tempo_slider" min="40" max="220" value="120">
            <label>Volume: <span id="volume_val">50</span>%</label>
            <input type="range" id="volume_slider" min="0" max="100" value="50">
        </div>
    </div>

    <div class="group">
        <div class="label">Patterns</div>

        <div class="controls">
            <div>
            Steps
            <select id="num_steps">
                <option value="4">4</option>
                <option value="8">8</option>
                <option value="12">12</option>
                <option value="14">14</option>
                <option value="16" selected="selected">16</option>
                <option value="24">24</option>
                <option value="27">27</option>
                <option value="32">32</option>
                <option value="36">36</option>
                <option value="48">48</option>
                <option value="64">64</option>
            </select>
            </div>
        </div>

        <div class="sequencer" id="pat_div">
        </div>

        <div class="controls">
            <button id="play_pat">Play</button>
        </div>

        <!-- TODO: pattern select buttons -->
    </div>

    <div class="group">
        <div class="label">Timeline</div>

        <div class="sequencer" id="pat_seq">
        </div>

        <div class="controls">
            <button id="play_song">Play</button>
        </div>
    </div>

</body>
</html>
