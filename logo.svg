<?xml version="1.0" encoding="UTF-8"?>
<!--
    Groovie logo.

    The letterforms are hand-built polygon paths rather than text in some font:
    an SVG loaded through an <img> tag can't pull in a web font, and relying on
    a font being installed would give a different logo on every machine. The
    shapes are drawn on a 120 unit cap height with a 24 unit stroke and 14 unit
    corner chamfers, then slanted as a whole.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 764 212" width="764" height="212"
     role="img" aria-label="Groovie">
<title>Groovie</title>

<defs>
    <!--
        Neon sweep, bright purple into the red the pattern grid uses.

        The coordinates are in the root coordinate system and span the width of
        the word, because the gradient is painted as one sheet seen through the
        letters rather than as a fill on them. Filling the letters with it
        doesn't work: the fill is inherited by each letter path, and each path
        resolves the gradient in its own coordinate system, so every letter runs
        the whole purple to red ramp on its own and the word comes out one
        uniform colour.
    -->
    <linearGradient id="neon" gradientUnits="userSpaceOnUse"
                    x1="40" y1="30" x2="730" y2="170">
        <stop offset="0" stop-color="#A81FFF"/>
        <stop offset="0.20" stop-color="#B93EFF"/>
        <stop offset="0.42" stop-color="#C64BFF"/>
        <stop offset="0.58" stop-color="#F0357E"/>
        <stop offset="0.74" stop-color="#FF2E22"/>
        <stop offset="1" stop-color="#FF3B2A"/>
    </linearGradient>

    <!-- Rule under the logo, fading out at both ends -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#B14BFF" stop-opacity="0"/>
        <stop offset="0.18" stop-color="#B14BFF" stop-opacity="0.85"/>
        <stop offset="0.82" stop-color="#FF3322" stop-opacity="0.85"/>
        <stop offset="1" stop-color="#FF3322" stop-opacity="0"/>
    </linearGradient>

    <!-- Two blur passes, a tight halo over a wide bloom -->
    <filter id="glow" x="-25%" y="-45%" width="150%" height="190%">
        <feGaussianBlur stdDeviation="6" result="tight"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="17" result="wide"/>
        <feMerge>
            <feMergeNode in="wide"/>
            <feMergeNode in="tight"/>
        </feMerge>
    </filter>

    <!-- Softens the chromatic fringes so they read as bleed, not as copies -->
    <filter id="fringe" x="-15%" y="-25%" width="130%" height="150%">
        <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- CRT scanlines, laid over the letters. Kept faint: the letters are only
         120 units tall, so anything heavier than this reads as stripes rather
         than as a texture over them. -->
    <pattern id="scan" width="9" height="9" patternUnits="userSpaceOnUse">
        <rect width="9" height="2" fill="#000" opacity="0.22"/>
    </pattern>

    <!--
        GROOVIE. Each letter is drawn from x=0 with the baseline at y=120, and
        placed by its own translate. The group carries the slant, so everything
        referencing it below lines up.
    -->
    <g id="letters" fill-rule="evenodd" transform="translate(50,40) skewX(-8)">
        <!-- G: chamfered ring, open on the right, with a tongue reaching in -->
        <path d="M14 0 L82 0 L96 14 L96 34 L72 34 L72 24 L24 24 L24 96 L72 96
                 L72 76 L44 76 L44 54 L96 54 L96 106 L82 120 L14 120 L0 106
                 L0 14 Z"/>
        <!-- R: stem, bowl, and a diagonal leg -->
        <path transform="translate(108,0)"
              d="M14 0 L60 0 L74 14 L74 76 L96 120 L68 120 L46 76 L24 76
                 L24 120 L14 120 L0 106 L0 14 Z
                 M24 24 L50 24 L50 52 L24 52 Z"/>
        <!-- O, twice -->
        <path transform="translate(216,0)"
              d="M14 0 L82 0 L96 14 L96 106 L82 120 L14 120 L0 106 L0 14 Z
                 M32 24 L64 24 L72 32 L72 88 L64 96 L32 96 L24 88 L24 32 Z"/>
        <path transform="translate(324,0)"
              d="M14 0 L82 0 L96 14 L96 106 L82 120 L14 120 L0 106 L0 14 Z
                 M32 24 L64 24 L72 32 L72 88 L64 96 L32 96 L24 88 L24 32 Z"/>
        <!-- V: cut off flat at the bottom instead of coming to a point -->
        <path transform="translate(432,0)"
              d="M0 0 L26 0 L48 80 L70 0 L96 0 L60 120 L36 120 Z"/>
        <!-- I: crossbars top and bottom, to hold its own next to the V -->
        <path transform="translate(540,0)"
              d="M10 0 L34 0 L44 10 L44 24 L34 24 L34 96 L44 96 L44 110
                 L34 120 L10 120 L0 110 L0 96 L10 96 L10 24 L0 24 L0 10 Z"/>
        <!-- E -->
        <path transform="translate(596,0)"
              d="M14 0 L70 0 L84 14 L84 24 L24 24 L24 48 L72 48 L72 72 L24 72
                 L24 96 L84 96 L84 106 L70 120 L14 120 L0 106 L0 14 Z"/>
    </g>

    <!--
        The word as a mask, so the gradient can be painted through it. This has
        to be a mask and not a clip path: a <use> inside a clipPath may only
        reference a shape, and pointing one at a group like #letters silently
        clips everything away.
    -->
    <mask id="mask_letters">
        <use href="#letters" xlink:href="#letters" fill="#FFF"/>
    </mask>

    <!--
        The glitch slices. Two narrow bands are cut out of the word by the masks
        here and redrawn shifted sideways below, so they read as displaced pieces
        of it. Drawn over the letters instead they'd just be a stripe across them.
    -->
    <mask id="mask_word">
        <use href="#letters" xlink:href="#letters" fill="#FFF"/>
        <rect x="0" y="97" width="764" height="10" fill="#000"/>
        <rect x="0" y="133" width="764" height="7" fill="#000"/>
    </mask>
    <mask id="notch">
        <rect width="764" height="212" fill="#FFF"/>
        <rect x="0" y="97" width="764" height="10" fill="#000"/>
        <rect x="0" y="133" width="764" height="7" fill="#000"/>
    </mask>
    <clipPath id="clip_slice_hi">
        <rect x="0" y="97" width="764" height="10"/>
    </clipPath>
    <clipPath id="clip_slice_lo">
        <rect x="0" y="133" width="764" height="7"/>
    </clipPath>
</defs>

<!-- Bloom. Left un-notched, so the slices don't cut gaps into the halo -->
<g filter="url(#glow)" opacity="0.6">
    <rect width="764" height="212" fill="url(#neon)" mask="url(#mask_letters)"/>
</g>

<!-- Chromatic bleed, one copy either side of the letters -->
<g mask="url(#notch)" filter="url(#fringe)" opacity="0.6">
    <use href="#letters" xlink:href="#letters" fill="#A62BFF" transform="translate(-3.5,-1.5)"/>
    <use href="#letters" xlink:href="#letters" fill="#FF2222" transform="translate(3.5,1.5)"/>
</g>

<!-- The word itself, plus a lit edge along its outline -->
<rect width="764" height="212" fill="url(#neon)" mask="url(#mask_word)"/>
<g mask="url(#notch)">
    <use href="#letters" xlink:href="#letters" fill="none"
         stroke="#FFF0FA" stroke-width="1.5" stroke-opacity="0.5"/>
</g>

<!--
    The displaced slices, filling the bands the masks cut out. The translate sits
    on a group, so the mask inside it shifts too and each slice is the word moved
    sideways rather than a window onto it.
-->
<g clip-path="url(#clip_slice_hi)">
    <g transform="translate(9,0)">
        <rect width="764" height="212" fill="url(#neon)" mask="url(#mask_letters)"/>
        <use href="#letters" xlink:href="#letters" fill="#E0B0FF" opacity="0.35"/>
    </g>
</g>
<g clip-path="url(#clip_slice_lo)">
    <g transform="translate(-7,0)">
        <rect width="764" height="212" fill="url(#neon)" mask="url(#mask_letters)"/>
        <use href="#letters" xlink:href="#letters" fill="#FF8A72" opacity="0.3"/>
    </g>
</g>

<!-- Scanlines, masked to the letters so they don't tint the background -->
<rect width="764" height="212" fill="url(#scan)" mask="url(#mask_letters)"/>

<!-- HUD rule and tick blocks -->
<rect x="34" y="184" width="696" height="2" fill="url(#rule)"/>
<g fill="#B14BFF">
    <rect x="34" y="180" width="3" height="10" opacity="0.85"/>
    <rect x="46" y="182" width="3" height="6" opacity="0.6"/>
</g>
<g fill="#FF3322">
    <rect x="727" y="180" width="3" height="10" opacity="0.85"/>
    <rect x="715" y="182" width="3" height="6" opacity="0.6"/>
</g>
</svg>
