name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-samples:
    name: Check sample format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check that all samples are 44.1 kHz 16-bit mono PCM
        run: python3 check_samples.py

  check-js:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check that all JavaScript files parse
        run: ./check_js.sh
