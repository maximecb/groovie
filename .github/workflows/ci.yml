name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-samples:
    name: Check samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check sample format, and sample_list.js against the samples
        run: python3 tools/check_samples.py

  check-js:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check that all JavaScript files parse
        run: ./tools/check_js.sh

  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the unit tests
        run: ./tools/run_tests.sh
