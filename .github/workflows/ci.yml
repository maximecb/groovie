name: CI

on:
  push:
    branches: [main]
  pull_request:

# What the token every run is handed is allowed to do. The jobs below check out
# the repo and run scripts over it, so reading the contents is the whole of it.
#
# Stated here rather than left to the repository settings, which decide it
# otherwise and can be changed without touching this file. Naming it means the
# scope a run holds is part of the repo, and an explicit block replaces the
# default rather than adding to it: everything left out of it is none.
permissions:
  contents: read

jobs:
  check-samples:
    name: Check samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check sample format, and sample_list.js against the samples
        run: python3 tools/check_samples.py

  check-js:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check that all JavaScript files parse
        run: ./tools/check_js.sh

  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the unit tests
        run: ./tools/run_tests.sh
